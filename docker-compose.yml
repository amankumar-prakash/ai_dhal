services:
  api_service:
    build: ./api_service
    ports:
      - "8000:8000"
    cpus: ${API_CPUS:-1}
    mem_limit: ${API_MEM_LIMIT:-1g}
    mem_reservation: ${API_MEM_RESERVATION:-256m}
    pids_limit: ${SERVICE_PIDS_LIMIT:-512}
    # Root .env is source of truth for Supabase URL/keys (avoid shell overrides).
    env_file: .env
    environment:
      RED_SERVICE_TOKEN: ${RED_SERVICE_TOKEN:-change-me-red}
      BLUE_SERVICE_TOKEN: ${BLUE_SERVICE_TOKEN:-change-me-blue}
      RED_WORKER_URL: http://red_team_backend:8001
      BLUE_WORKER_URL: http://blue_team_backend:8002
      # Explicitly do NOT pass OPENAI_API_KEY / LLM_MODEL here
      # User JWTs verified via JWKS; JWT secret optional legacy fallback only
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - red_team_backend
      - blue_team_backend

  red_team_backend:
    build:
      context: .
      dockerfile: red_team_backend/Dockerfile
    ports:
      - "8001:8001"
    cpus: ${RED_CPUS:-2}
    mem_limit: ${RED_MEM_LIMIT:-3g}
    mem_reservation: ${RED_MEM_RESERVATION:-512m}
    pids_limit: ${SERVICE_PIDS_LIMIT:-512}
    env_file: .env
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_STUB: ${LLM_STUB:-1}
      LLM_CONTEXT_WINDOW: ${LLM_CONTEXT_WINDOW:-0}
      LLM_COMPRESS_TRIGGER_RATIO: ${LLM_COMPRESS_TRIGGER_RATIO:-0.8}
      API_BASE_URL: http://api_service:8000/api/v1
      RED_SERVICE_TOKEN: ${RED_SERVICE_TOKEN:-change-me-red}
      DEMO_SAFE_MODE: ${DEMO_SAFE_MODE:-1}
      TARGET_ALLOWLIST: ${TARGET_ALLOWLIST:-}
      # Internal compose DNS — do not use host.docker.internal from root .env here
      HEXSTRIKE_BASE_URL: http://hexstrike_server:8005
      HEXSTRIKE_MCP_SCRIPT: /app/hexstrike/hexstrike_mcp.py
      HEXSTRIKE_STUB: ${HEXSTRIKE_STUB:-0}
      ARTIFACT_ROOT: ${ARTIFACT_ROOT:-/tmp/ai_dhal/jobs}
      LLMLINGUA_ENABLED: ${LLMLINGUA_ENABLED:-1}
      LLMLINGUA_DEVICE: ${LLMLINGUA_DEVICE:-cpu}
      LLMLINGUA_MODEL: ${LLMLINGUA_MODEL:-microsoft/llmlingua-2-bert-base-multilingual-cased-meetingbank}
      TOOL_SUMMARY_TOKENS: ${TOOL_SUMMARY_TOKENS:-800}
      PHASE_ROLLUP_TOKENS: ${PHASE_ROLLUP_TOKENS:-1500}
      JOB_CONTEXT_TOKENS: ${JOB_CONTEXT_TOKENS:-3000}
      MAX_TOOLS_PER_JOB: ${MAX_TOOLS_PER_JOB:-24}
      MAX_TOOLS_PER_PHASE: ${MAX_TOOLS_PER_PHASE:-8}
      MAX_PHASE_LOOPS: ${MAX_PHASE_LOOPS:-2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: ${LOG_DIR:-/tmp/ai_dhal/logs}
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-10485760}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-5}
      JOB_LOG_ENABLED: ${JOB_LOG_ENABLED:-1}
      RESOURCE_SAMPLE_ENABLED: ${RESOURCE_SAMPLE_ENABLED:-1}
      RESOURCE_SAMPLE_INTERVAL_SECONDS: ${RESOURCE_SAMPLE_INTERVAL_SECONDS:-5}
      MAX_CPU_THREADS: ${MAX_CPU_THREADS:-2}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-2}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-2}
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-2}
      NUMEXPR_NUM_THREADS: ${NUMEXPR_NUM_THREADS:-2}
      # CAI disabled
      # CAI_WORKDIR: ${CAI_WORKDIR:-/cai}
      # CAI_STUB: ${CAI_STUB:-0}
      # CAI_CHAT_STUB: ${CAI_CHAT_STUB:-1}
      # CAI_AGENT_TYPE: ${CAI_AGENT_TYPE:-redteam_agent}
      # CAI_CONTAINER_VENV: ${CAI_CONTAINER_VENV:-/var/cache/cai-venv}
      # UV_PROJECT_ENVIRONMENT: ${CAI_CONTAINER_VENV:-/var/cache/cai-venv}
      # No DATABASE_URL / SUPABASE_SERVICE_ROLE_KEY / SUPABASE_SECRET_KEY
    # volumes:
    #   - ${CAI_HOST_PATH:-../cai_pentesting}:/cai  # CAI disabled
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      hexstrike_server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  blue_team_backend:
    build: ./blue_team_backend
    ports:
      - "8002:8002"
    cpus: ${BLUE_CPUS:-2}
    mem_limit: ${BLUE_MEM_LIMIT:-2g}
    mem_reservation: ${BLUE_MEM_RESERVATION:-512m}
    pids_limit: ${SERVICE_PIDS_LIMIT:-512}
    env_file: .env
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_STUB: ${LLM_STUB:-1}
      API_BASE_URL: http://api_service:8000/api/v1
      BLUE_SERVICE_TOKEN: ${BLUE_SERVICE_TOKEN:-change-me-blue}
      DEMO_SAFE_MODE: ${DEMO_SAFE_MODE:-1}
      TARGET_ALLOWLIST: ${TARGET_ALLOWLIST:-}
      HEXSTRIKE_BASE_URL: ${HEXSTRIKE_BASE_URL:-http://hexstrike_server:8005}
      HEXSTRIKE_STUB: ${HEXSTRIKE_STUB:-0}
      CAI_WORKDIR: ${CAI_WORKDIR:-/cai}
      CAI_STUB: ${CAI_STUB:-0}
      CAI_CHAT_STUB: ${CAI_CHAT_STUB:-1}
      CAI_AGENT_TYPE: ${CAI_AGENT_TYPE_BLUE:-bug_bounter_agent}
      CAI_CONTAINER_VENV: ${CAI_CONTAINER_VENV:-/var/cache/cai-venv}
      UV_PROJECT_ENVIRONMENT: ${CAI_CONTAINER_VENV:-/var/cache/cai-venv}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: ${LOG_DIR:-/tmp/ai_dhal/logs}
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-10485760}
      LOG_BACKUP_COUNT: ${LOG_BACKUP_COUNT:-5}
      JOB_LOG_ENABLED: ${JOB_LOG_ENABLED:-1}
      RESOURCE_SAMPLE_ENABLED: ${RESOURCE_SAMPLE_ENABLED:-1}
      RESOURCE_SAMPLE_INTERVAL_SECONDS: ${RESOURCE_SAMPLE_INTERVAL_SECONDS:-5}
      MAX_CPU_THREADS: ${MAX_CPU_THREADS:-2}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-2}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-2}
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-2}
      NUMEXPR_NUM_THREADS: ${NUMEXPR_NUM_THREADS:-2}
      # No DATABASE_URL / SUPABASE_SERVICE_ROLE_KEY / SUPABASE_SECRET_KEY
    volumes:
      - ${CAI_HOST_PATH:-../cai_pentesting}:/cai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      hexstrike_server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  hexstrike_server:
    build: ./hexstrike_server
    ports:
      - "8005:8005"
    cpus: ${HEXSTRIKE_CPUS:-2}
    mem_limit: ${HEXSTRIKE_MEM_LIMIT:-2g}
    mem_reservation: ${HEXSTRIKE_MEM_RESERVATION:-512m}
    pids_limit: ${HEXSTRIKE_PIDS_LIMIT:-1024}
    environment:
      PYTHONUNBUFFERED: "1"
      HEXSTRIKE_PORT: "8005"
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-2}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-2}
      OPENBLAS_NUM_THREADS: ${OPENBLAS_NUM_THREADS:-2}
      NUMEXPR_NUM_THREADS: ${NUMEXPR_NUM_THREADS:-2}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8005/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
