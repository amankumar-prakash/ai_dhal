; Supervisord config — native AI Dhal stack (localhost ports)
; Start:  ./scripts/run_supervisor.sh start
; Status: ./scripts/run_supervisor.sh status
; Stop:   ./scripts/run_supervisor.sh stop

[unix_http_server]
file=/home/ai_lab/workspace/ai_dhal/run/supervisor.sock

[supervisord]
logfile=/home/ai_lab/workspace/ai_dhal/run/supervisord.log
pidfile=/home/ai_lab/workspace/ai_dhal/run/supervisord.pid
childlogdir=/home/ai_lab/workspace/ai_dhal/run
nodaemon=false
directory=/home/ai_lab/workspace/ai_dhal

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///home/ai_lab/workspace/ai_dhal/run/supervisor.sock

[program:api_service]
command=/home/ai_lab/workspace/ai_dhal/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000
directory=/home/ai_lab/workspace/ai_dhal/api_service
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
stdout_logfile=/home/ai_lab/workspace/ai_dhal/run/api_service.log
stderr_logfile=/home/ai_lab/workspace/ai_dhal/run/api_service.err.log
environment=PYTHONUNBUFFERED="1",HOME="/home/ai_lab"

[program:red_team_backend]
command=/home/ai_lab/workspace/ai_dhal/.venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8001
directory=/home/ai_lab/workspace/ai_dhal/red_team_backend
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
stdout_logfile=/home/ai_lab/workspace/ai_dhal/run/red_team_backend.log
stderr_logfile=/home/ai_lab/workspace/ai_dhal/run/red_team_backend.err.log
environment=PYTHONUNBUFFERED="1",HOME="/home/ai_lab",HEXSTRIKE_MCP_SCRIPT="/home/ai_lab/workspace/ai_dhal/hexstrike_server/hexstrike-ai/hexstrike_mcp.py"

[program:blue_team_backend]
command=/home/ai_lab/workspace/ai_dhal/.venv/bin/python -m uvicorn app.main:app --host 127.0.0.1 --port 8002
directory=/home/ai_lab/workspace/ai_dhal/blue_team_backend
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
stdout_logfile=/home/ai_lab/workspace/ai_dhal/run/blue_team_backend.log
stderr_logfile=/home/ai_lab/workspace/ai_dhal/run/blue_team_backend.err.log
environment=PYTHONUNBUFFERED="1",HOME="/home/ai_lab"

[program:hexstrike_server]
command=/home/ai_lab/workspace/ai_dhal/hexstrike_server/hexstrike-ai/.venv/bin/python hexstrike_server.py --port 8005
directory=/home/ai_lab/workspace/ai_dhal/hexstrike_server/hexstrike-ai
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=15
stdout_logfile=/home/ai_lab/workspace/ai_dhal/run/hexstrike_server.log
stderr_logfile=/home/ai_lab/workspace/ai_dhal/run/hexstrike_server.err.log
environment=PYTHONUNBUFFERED="1",HEXSTRIKE_PORT="8005",HOME="/home/ai_lab",PATH="/home/ai_lab/.local/bin:/usr/local/bin:/usr/bin:/bin"

[program:secure_dash]
command=/bin/bash /home/ai_lab/workspace/ai_dhal/scripts/run_secure_dash.sh
directory=/home/ai_lab/workspace/ai_dhal/secure_dash
autostart=true
autorestart=true
startsecs=8
stopwaitsecs=10
stdout_logfile=/home/ai_lab/workspace/ai_dhal/run/secure_dash.log
stderr_logfile=/home/ai_lab/workspace/ai_dhal/run/secure_dash.err.log
environment=HOME="/home/ai_lab"
